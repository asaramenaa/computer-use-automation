[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuc"
version = "0.1.0"
description = "Computer-use capabilities: LLM discovers a legacy UI flow once, typed artifact, deterministic replay, human handoff."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.47",
  "pydantic>=2.7",
  "flask>=3.0",
  "openai>=1.50",
  "google-genai>=1.0",
  "anthropic>=0.40",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cuc = "cuc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cuc.target_app" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
